# Render Blueprint: creates the web service and the Postgres database together,
# wired to each other, from one "New +" > "Blueprint" action.
# JWT_SECRET and ADMIN_PASSWORD are sync:false - Render prompts for them once at
# creation and stores them as secrets; they never go in this file or in git.
services:
  - name: resortbooking
    type: web
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: resortbooking-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: resortbooking-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: resortbooking-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: resortbooking-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: resortbooking-db
          property: password
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        value: admin@resort.test
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: resortbooking-db
    plan: free
