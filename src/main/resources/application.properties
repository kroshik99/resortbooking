spring.application.name=resortbooking

# Render binds to whatever port it assigns via $PORT; locally that's unset, so 8080.
server.port=${PORT:8080}

# Host/port/name are separate so a managed Postgres (e.g. Render's fromDatabase
# env vars) can be wired in piece by piece, without needing the combined
# postgres:// connection string Spring can't consume directly.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:resortbooking}
spring.datasource.username=${DB_USER:resort}
spring.datasource.password=${DB_PASSWORD:resort}

# No default: the secret must come from the environment, never from source control.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiry-seconds=3600

# Optional bootstrap of the first admin; blank means skip.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Flyway owns the schema; Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
