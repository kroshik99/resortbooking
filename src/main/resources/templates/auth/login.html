<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/guest :: page('Log in', ~{::main})}">
<head><title>Log in</title></head>
<body>
<main>
    <h1>Log in</h1>
    <p class="sub">Use the email address you registered with.</p>

    <p class="alert alert-error" th:if="${param.error}">Wrong email or password.</p>
    <p class="alert alert-success" th:if="${param.logout}">You have been logged out.</p>

    <form class="card" th:action="@{/login}" method="post">
        <div class="field">
            <label for="username">Email</label>
            <input type="email" id="username" name="username" autocomplete="username" required autofocus>
        </div>
        <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn-primary">Log in</button>
    </form>

    <p>No account yet? <a th:href="@{/register}">Create one</a>.</p>
</main>
</body>
</html>
