<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/guest :: page('Create an account', ~{::main})}">
<head><title>Create an account</title></head>
<body>
<main>
    <h1>Create an account</h1>
    <p class="sub">So you can manage your bookings later.</p>

    <form class="card" th:action="@{/register}" th:object="${registerForm}" method="post">
        <div class="field">
            <label for="fullName">Full name</label>
            <input type="text" id="fullName" th:field="*{fullName}" autocomplete="name">
            <p class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></p>
        </div>

        <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" th:field="*{email}" autocomplete="email">
            <p class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
        </div>

        <div class="field">
            <label for="phone">Phone (optional)</label>
            <input type="tel" id="phone" th:field="*{phone}" autocomplete="tel">
            <p class="field-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></p>
        </div>

        <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" th:field="*{password}" autocomplete="new-password">
            <p class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
        </div>

        <button type="submit" class="btn-primary">Create account</button>
    </form>

    <p>Already registered? <a th:href="@{/login}">Log in</a>.</p>
</main>
</body>
</html>
