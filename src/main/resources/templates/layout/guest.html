<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="page(pageTitle, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle} + ' · Resort Booking'">Resort Booking</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="topbar">
    <a class="brand" th:href="@{/}">Resort Booking</a>
    <nav class="topnav">
        <a class="staff-link" th:href="@{/staff/calendar}" sec:authorize="hasRole('FRONT_DESK')">
            Staff area
        </a>

        <a class="staff-link" th:href="@{/admin/rooms}" sec:authorize="hasRole('ADMIN')">
            Admin settings
        </a>

        <details class="account-menu" sec:authorize="isAuthenticated()">
            <summary>Account</summary>
            <div class="account-menu-panel">
                <a th:href="@{/me/bookings}">My bookings</a>
                <a th:href="@{/me/staff-request}" sec:authorize="hasRole('GUEST')">Become staff</a>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="linklike">Log out</button>
                </form>
            </div>
        </details>

        <a th:href="@{/login}" sec:authorize="!isAuthenticated()">Log in</a>
    </nav>
</header>

<div class="wrap">
    <div th:replace="~{fragments/alert :: alert}"></div>
    <main th:replace="${content}">
        <!-- page content is injected here -->
    </main>
</div>
</body>
</html>
