<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="page(pageTitle, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle} + ' · Resort Booking'">Resort Booking</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="topbar">
    <a class="brand" th:href="@{/}">Resort Booking</a>
    <nav class="topnav">
        <a th:href="@{/me/bookings}" sec:authorize="isAuthenticated()">My bookings</a>
        <a th:href="@{/staff/calendar}" sec:authorize="hasAnyRole('FRONT_DESK','ADMIN')">Staff</a>
        <a th:href="@{/admin/checkin-requests}" sec:authorize="hasRole('ADMIN')">
            Approvals
            <span class="badge" th:if="${pendingApprovalCount != null and pendingApprovalCount > 0}"
                  th:text="${pendingApprovalCount}">2</span>
        </a>
        <a th:href="@{/login}" sec:authorize="!isAuthenticated()">Log in</a>
        <form th:action="@{/logout}" method="post" sec:authorize="isAuthenticated()">
            <button type="submit" class="linklike">Log out</button>
        </form>
    </nav>
</header>

<div class="wrap">
    <div th:replace="~{fragments/alert :: alert}"></div>
    <main th:replace="${content}">
        <!-- page content is injected here -->
    </main>
</div>
</body>
</html>
