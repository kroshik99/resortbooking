<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/guest :: page('Check-in approvals', ~{::main})}">
<head><title>Check-in approvals</title></head>
<body>
<main>
    <h1>Check-in approvals</h1>
    <p class="sub">Front desk asked to check these guests in outside their booked date.</p>

    <p class="empty" th:if="${#lists.isEmpty(requests)}">Nothing waiting on approval.</p>

    <div class="card" th:each="req : ${requests}">
        <div class="option">
            <div>
                <div class="price" style="font-size:15px" th:text="${req.bookingReference()}">RB-2026-00001</div>
                <div class="option-name">
                    <span th:text="${req.guestName()}">Juan Dela Cruz</span>
                    · <span th:text="${req.roomType()}">Deluxe</span>
                    room <span th:text="${req.roomNumber()}">201</span>
                </div>
                <div class="option-meta">
                    Booked check-in: <span th:text="${#temporals.format(req.checkIn(), 'MMM d, yyyy')}">Dec 3</span>
                </div>
                <div class="option-meta">
                    Requested by <span th:text="${req.requestedByName()}">front.desk@resort.test</span>,
                    <span th:text="${#temporals.format(req.requestedAt(), 'MMM d, yyyy h:mm a')}">Dec 1, 2:00 PM</span>
                </div>
            </div>
            <div class="actions">
                <form th:action="@{/admin/checkin-requests/{id}/approve(id=${req.id()})}" method="post">
                    <button type="submit" class="btn-primary">Approve</button>
                </form>
                <form th:action="@{/admin/checkin-requests/{id}/reject(id=${req.id()})}" method="post">
                    <button type="submit" class="btn-danger">Reject</button>
                </form>
                <a th:href="@{/staff/bookings/{ref}(ref=${req.bookingReference()})}">View booking</a>
            </div>
        </div>
    </div>
</main>
</body>
</html>
