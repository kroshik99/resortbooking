<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/guest :: page('Edit room type', ~{::main})}">
<head><title>Edit room type</title></head>
<body>
<main>
    <h1>Edit room type</h1>

    <form class="card" th:action="@{/admin/room-types/{id}(id=${roomTypeId})}" th:object="${roomTypeForm}"
          method="post">
        <div class="field">
            <label for="name">Name</label>
            <input type="text" id="name" th:field="*{name}">
            <p class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
        </div>
        <div class="field">
            <label for="capacity">Capacity</label>
            <input type="number" id="capacity" th:field="*{capacity}" min="1">
            <p class="field-error" th:if="${#fields.hasErrors('capacity')}" th:errors="*{capacity}"></p>
        </div>
        <div class="field">
            <label for="basePrice">Base price per night</label>
            <input type="number" step="0.01" id="basePrice" th:field="*{basePrice}">
            <p class="field-error" th:if="${#fields.hasErrors('basePrice')}" th:errors="*{basePrice}"></p>
        </div>
        <div class="field">
            <label for="description">Description (optional)</label>
            <input type="text" id="description" th:field="*{description}">
        </div>
        <button type="submit" class="btn-primary">Save changes</button>
    </form>

    <p><a th:href="@{/admin/room-types}">&larr; Back to room types</a></p>
</main>
</body>
</html>
