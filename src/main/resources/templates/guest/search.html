<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/guest :: page('Find a room', ~{::main})}">
<head><title>Find a room</title></head>
<body>
<main>
    <h1>Find a room</h1>
    <p class="sub">Pick your dates and we will show what is free.</p>

    <form class="card" th:action="@{/rooms}" method="get">
        <div class="row">
            <div class="field">
                <label for="checkIn">Check in</label>
                <input type="date" id="checkIn" name="checkIn" th:value="${defaultCheckIn}" required>
            </div>
            <div class="field">
                <label for="checkOut">Check out</label>
                <input type="date" id="checkOut" name="checkOut" th:value="${defaultCheckOut}" required>
            </div>
        </div>

        <div class="field">
            <label for="guests">Guests</label>
            <select id="guests" name="guests">
                <option value="1">1 guest</option>
                <option value="2" selected>2 guests</option>
                <option value="3">3 guests</option>
                <option value="4">4 guests</option>
            </select>
        </div>

        <button type="submit" class="btn-primary">Search</button>
    </form>
</main>
</body>
</html>
