<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/guest :: page('Your details', ~{::main})}">
<head><title>Your details</title></head>
<body>
<main>
    <h1>Your details</h1>
    <p class="sub" th:if="${quote}">
        <span th:text="${quote.roomType()}">Deluxe</span> ·
        <span th:text="${quote.nights()}">2</span> nights ·
        &#8369;<span th:text="${quote.totalPrice()}">7000.00</span>
    </p>

    <form class="card" th:action="@{/book/review}" th:object="${bookingForm}" method="post">
        <input type="hidden" th:field="*{roomTypeId}">
        <input type="hidden" th:field="*{checkIn}">
        <input type="hidden" th:field="*{checkOut}">
        <input type="hidden" th:field="*{numGuests}">

        <div class="field">
            <label for="fullName">Full name</label>
            <input type="text" id="fullName" th:field="*{fullName}" autocomplete="name">
            <p class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></p>
        </div>

        <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" th:field="*{email}" autocomplete="email">
            <p class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
        </div>

        <div class="field">
            <label for="phone">Phone (optional)</label>
            <input type="tel" id="phone" th:field="*{phone}" autocomplete="tel">
            <p class="field-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></p>
        </div>

        <button type="submit" class="btn-primary">Review booking</button>
    </form>

    <p><a th:href="@{/rooms(checkIn=*{checkIn},checkOut=*{checkOut},guests=*{numGuests})}">Back to rooms</a></p>
</main>
</body>
</html>
