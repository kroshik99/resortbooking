spring.application.name=resortbooking

# Every test class is @Transactional and rolls back, so running against the dev
# database is safe. An isolated database is still better - it stops tests passing
# because of data that happens to be lying around. To switch:
#   psql -U postgres -c "CREATE DATABASE resortbooking_test OWNER resort;"
# then point this at resortbooking_test.
spring.datasource.url=jdbc:postgresql://localhost:5432/${TEST_DB:resortbooking}
spring.datasource.username=${DB_USER:resort}
spring.datasource.password=${DB_PASSWORD:resort}

# Test-only signing key. Not a secret, and never used outside tests.
app.jwt.secret=test-only-signing-key-not-for-production-0123456789
app.jwt.expiry-seconds=3600

app.admin.email=
app.admin.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
